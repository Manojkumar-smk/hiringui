_schema-version: "3.2"
ID: hiringui
version: 0.0.1
modules:
- name: hiringui-destination-content
  type: com.sap.application.content
  requires:
  - name: hiringui-destination-service
    parameters:
      content-target: true
  - name: hiringui_html_repo_host
    parameters:
      service-key:
        name: hiringui_html_repo_host-key
  - name: uaa_hiringui
    parameters:
      service-key:
        name: uaa_hiringui-key
  parameters:
    content:
      subaccount:
        destinations:
        - Name: hiringui_hiringui_html_repo_host
          ServiceInstanceName: hiringui-html5-app-host-service
          ServiceKeyName: hiringui_html_repo_host-key
          sap.cloud.service: hiringui
        - Authentication: OAuth2UserTokenExchange
          Name: hiringui_uaa_hiringui
          ServiceInstanceName: hiringui-xsuaa-service
          ServiceKeyName: uaa_hiringui-key
          sap.cloud.service: hiringui
        existing_destinations_policy: ignore
  build-parameters:
    no-source: true
- name: hiringui-app-content
  type: com.sap.application.content
  path: .
  requires:
  - name: hiringui_html_repo_host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - comhrcandidateinfo.zip
      name: comhrcandidateinfo
      target-path: resources/
- name: comhrcandidateinfo
  type: html5
  path: candidate-info
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
resources:
- name: hiringui-destination-service
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: true
      init_data:
        subaccount:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          existing_destinations_policy: update
      version: 1.0.0
    service: destination
    service-name: hiringui-destination-service
    service-plan: lite
- name: hiringui_html_repo_host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: hiringui-html5-app-host-service
    service-plan: app-host
- name: uaa_hiringui
  type: org.cloudfoundry.managed-service
  parameters:
    path: ./xs-security.json
    service: xsuaa
    service-name: hiringui-xsuaa-service
    service-plan: application
parameters:
  deploy_mode: html5-repo
