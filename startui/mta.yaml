_schema-version: "3.2"
ID: startui
version: 0.0.1
modules:
- name: startui-destination-content
  type: com.sap.application.content
  requires:
  - name: startui-destination-service
    parameters:
      content-target: true
  - name: startui_html_repo_host
    parameters:
      service-key:
        name: startui_html_repo_host-key
  - name: uaa_startui
    parameters:
      service-key:
        name: uaa_startui-key
  parameters:
    content:
      subaccount:
        destinations:
        - Name: startui_startui_html_repo_host
          ServiceInstanceName: startui-html5-app-host-service
          ServiceKeyName: startui_html_repo_host-key
          sap.cloud.service: startui
        - Authentication: OAuth2UserTokenExchange
          Name: startui_uaa_startui
          ServiceInstanceName: startui-xsuaa-service
          ServiceKeyName: uaa_startui-key
          sap.cloud.service: startui
        existing_destinations_policy: ignore
  build-parameters:
    no-source: true
- name: startui-app-content
  type: com.sap.application.content
  path: .
  requires:
  - name: startui_html_repo_host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - anubhavstartmyfioriapp.zip
      name: anubhavstartmyfioriapp
      target-path: resources/
- name: anubhavstartmyfioriapp
  type: html5
  path: myfioriapp
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
resources:
- name: startui-destination-service
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: true
      init_data:
        subaccount:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          existing_destinations_policy: update
      version: 1.0.0
    service: destination
    service-name: startui-destination-service
    service-plan: lite
- name: startui_html_repo_host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: startui-html5-app-host-service
    service-plan: app-host
- name: uaa_startui
  type: org.cloudfoundry.managed-service
  parameters:
    path: ./xs-security.json
    service: xsuaa
    service-name: startui-xsuaa-service
    service-plan: application
- name: build_bpa_runtime
  type: org.cloudfoundry.existing-service
parameters:
  deploy_mode: html5-repo
